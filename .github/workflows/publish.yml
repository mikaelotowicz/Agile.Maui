# Empacota os 6 componentes (Agile.Maui.PackAll.proj) e publica no nuget.org.
#
# Disparo:
#   - tag v* (ex.: v1.0.7)  → canal Stable
#   - manual (Actions → Publicar no NuGet → Run workflow) → escolhe canal e dry-run
#
# Autenticação (uma vez, no nuget.org + GitHub) — dois caminhos, o workflow usa o que existir:
#   A) Trusted Publishing (recomendado, sem chave de longa duração): no nuget.org,
#      menu do usuário → Trusted Publishing → nova política com Repository Owner
#      "mikaelotowicz", Repository "Agile.Maui", Workflow File "publish.yml" (só o
#      nome do arquivo) e Environment vazio; no GitHub, criar o secret NUGET_USER
#      com o seu USERNAME do nuget.org (não o e-mail). A action NuGet/login troca o
#      token OIDC do job por uma API key temporária de 1 hora.
#   B) Clássico: API key do nuget.org com escopo de push para Agile.Maui.*, salva
#      como secret NUGET_API_KEY.
#   - A primeira publicação de cada ID (ou a reserva do prefixo Agile.Maui.*) deve
#     ser feita pela conta dona dos pacotes.
#
# O push usa --skip-duplicates: versões já publicadas são ignoradas, então só os
# pacotes cuja versão (definida em cada .csproj) mudou sobem de fato. Os símbolos
# (.snupkg) sobem automaticamente junto de cada .nupkg.
name: Publicar no NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Canal de pacote (AgilePackageChannel)
        type: choice
        options: [Stable, Preview]
        default: Stable
      dry_run:
        description: Só empacotar e anexar os .nupkg como artifact (sem publicar)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC para o Trusted Publishing do nuget.org (inócuo quando não usado)

jobs:
  publicar:
    name: Pack + publish (${{ inputs.channel || 'Stable' }})
    runs-on: windows-latest # único SO que produz todos os TFMs; o PackAll falha nos demais
    timeout-minutes: 90
    env:
      CHANNEL: ${{ inputs.channel || 'Stable' }}
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK 11 (prerelease)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Instalar workload MAUI
        run: dotnet workload install maui

      # Gate de qualidade: nada é publicado com teste vermelho.
      - name: Testes
        run: |
          dotnet test ChipGroup.Tests -c Release --nologo
          dotnet test GalleryView.Tests -c Release --nologo
          dotnet test PDFViewer.Tests -c Release --nologo
          dotnet test SignaturePad.Tests -c Release --nologo
          dotnet test VirtualizedCollectionView.Tests -c Release --nologo
          dotnet test PdfGen.Tests -c Release --nologo

      - name: Pack (${{ env.CHANNEL }})
        run: dotnet msbuild Agile.Maui.PackAll.proj -t:Pack${{ env.CHANNEL }} "-p:PackageOutputPath=${{ github.workspace }}\nupkgs-ci"

      - name: Anexar pacotes ao run
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ env.CHANNEL }}
          path: |
            nupkgs-ci/*.nupkg
            nupkgs-ci/*.snupkg
          if-no-files-found: error

      # Trusted Publishing: troca o token OIDC do job por uma API key temporária (1 h),
      # logo antes do push para não expirar. Roda só quando o secret NUGET_USER existe.
      - name: NuGet login (Trusted Publishing)
        if: ${{ env.NUGET_USER != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publicar no nuget.org
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            throw "Configure o Trusted Publishing (secret NUGET_USER + política no nuget.org) ou o secret NUGET_API_KEY."
          }
          dotnet nuget push "nupkgs-ci\*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicates
